name: Problem report
description: Something doesn't work in SlippWii
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing SlippWii! It is an unofficial project: please report SlippWii problems here, not to the Slippi team.
        **Never post your `user.json` or its contents**: it is your Slippi login.
  - type: input
    id: version
    attributes:
      label: SlippWii version
      description: Shown at the top of the SlippWii screen, e.g. 1.8.1
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Installing or updating (the SD card, Check for Updates)
        - Starting SlippWii / loading Melee
        - Online menus (searching, connecting)
        - During a game (lag, desync, freeze)
        - After a game
        - Something else
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Online mode
      options:
        - Direct
        - Unranked
        - Teams
        - Party
        - Not online / not applicable
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Wii model, LAN adapter, and your opponent's setup (Slippi Dolphin on PC, another Wii, ...) and rough distance/ping
      placeholder: Wii RVL-001, USB LAN adapter; opponent on Slippi Dolphin 3.7.0, same city
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Can you make it happen again?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and replays
      description: Attach the zipped `slippwii/logs` folder from the SD card (or from the USB drive your game is on). SlippWii saves a report there by itself when something goes wrong. For a problem that keeps happening, turn on Diagnostic Log in Slippi Settings first and play until it happens again. For desyncs, the opponent's Slippi replay (.slp) of that game helps a lot. IP addresses and connect codes are masked in the logs; your play key is never written.
